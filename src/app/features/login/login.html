<div class="login-page">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
      <mat-card-subtitle>
        Acceso al sistema de gestión escolar mediante autenticación JWT.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (loading()) {
        <div class="center">
          <mat-spinner diameter="40" />
        </div>
      } @else {
        <form [formGroup]="loginForm" (ngSubmit)="ingresar()" class="login-form">
          <mat-form-field appearance="outline" class="full">
            <mat-label>Correo electrónico</mat-label>
            <input
              matInput
              type="email"
              formControlName="correo"
              autocomplete="email"
            />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full">
            <mat-label>Contraseña</mat-label>
            <input
              matInput
              type="password"
              formControlName="password"
              autocomplete="current-password"
            />
          </mat-form-field>

          <button
            mat-flat-button
            color="primary"
            type="submit"
            class="submit-btn"
          >
            Ingresar
          </button>
        </form>
      }
    </mat-card-content>
  </mat-card>
</div>
